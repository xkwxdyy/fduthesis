name: Standalone enhanced class
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install current TeX Live
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fduthesis-texlive-installer
          curl --fail --location --retry 3 https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz -o /tmp/fduthesis-install-tl.tar.gz
          tar -xzf /tmp/fduthesis-install-tl.tar.gz -C /tmp/fduthesis-texlive-installer --strip-components=1
          cd /tmp/fduthesis-texlive-installer
          perl install-tl --no-interaction --profile "$GITHUB_WORKSPACE/.github/workflows/texlive.profile"
          /tmp/texlive/bin/x86_64-linux/tlmgr install collection-xetex collection-latexextra collection-langchinese collection-mathscience biber biblatex-gb7714-2015 gbt7714 latexmk lm-math tex-gyre-math xits libertinus-fonts
          echo /tmp/texlive/bin/x86_64-linux >> "$GITHUB_PATH"
      - name: Check generated and standalone runtime files
        run: python3 tests/check-standalone.py
